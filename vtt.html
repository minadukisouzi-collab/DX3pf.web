<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DX3rd Online Session Platform</title>
  <link rel="stylesheet" href="style.css">
  <meta name="robots" content="noindex, nofollow">
  <!-- SupabaseのJavaScriptライブラリ読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="app-container">
  <header>
    <div style="display: flex; align-items: center; gap: 10px;">
      <div class="title-logo">DX3rd VTT</div>
      <button class="btn" id="leave-room-btn" style="width: auto; padding: 2px 8px; font-size: 0.7rem; background: transparent; border: 1px solid var(--accent-red); color: var(--accent-red); cursor: pointer;">ロビーに戻る</button>
    </div>
    
    <div class="timeline-bar">
      <div class="timeline-item">
        <span style="color:var(--accent-gold); font-weight:bold;">Phase:</span>
        <span id="current-phase-text" style="color:var(--text-main);">オープニングフェイズ</span>
      </div>
      <div class="timeline-item"><span>Sc:</span> <input type="number" id="scene-num" value="1" style="width:25px; background:transparent; color:var(--text-main); border:none;" readonly></div>
      <div class="timeline-item"><span>Rd:</span> <input type="number" id="round-num" value="1" style="width:25px; background:transparent; color:var(--text-main); border:none;" readonly></div>
      
      <!-- 通常モード / 戦闘モードの切り替えエリア -->
      <div id="mode-controls" style="display:flex; gap:4px; align-items:center;"></div>
    </div>

    <!-- ② ダークモード / ライトモード切り替えボタン -->
    <div style="display: flex; align-items: center;">
      <button class="theme-toggle" id="toggle-theme" style="background: var(--bg-main); color: var(--text-main); border: 1px solid var(--border-color); padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer;">ライトモード</button>
    </div>
  </header>

  <div id="main-content">
    <div id="char-sidebar">
      <div class="sidebar-section">
        <!-- キャラクター一覧タイトルの部分 -->
        <div class="sidebar-title">
          <span>キャラクター一覧</span>
          <div style="display:flex; gap:4px;">
            <button class="btn btn-purple" onclick="openEffectModal()" style="font-size:0.7rem;">+ エフェクト追加</button>
            <button class="btn" onclick="addCharacter()">+ キャラ追加</button>
          </div>
        </div>
        <div id="character-list"></div>
      </div>
    </div>

    <div id="center-right-area">
      <div id="board-wrapper">
        <div class="board-controls">
          <button class="btn" onclick="zoomBoard(0.1)">＋</button>
          <button class="btn" onclick="zoomBoard(-0.1)">－</button>
          <button class="btn" onclick="resetBoardView()">リセット</button>
        </div>
        <div id="board-viewport"></div>
      </div>

      <div id="chat-wrapper">
        <div class="chat-tabs-bar">
          <!-- ③ チャットタブ欄に「メンバー」タブを追加 -->
          <div class="chat-tabs" id="chat-tabs-list">
            <div class="chat-tab active" onclick="switchChatTab('main')">メイン</div>
            <div class="chat-tab" onclick="switchChatTab('sub')">雑談</div>
            <div class="chat-tab" onclick="switchChatTab('info')">情報</div>
            <div class="chat-tab" onclick="switchChatTab('members')">メンバー</div>
          </div>
          <button class="chat-toggle-btn" id="chat-toggle-btn" onclick="toggleChatPanel()">▼ 畳む</button>
        </div>

        <!-- ログ表示エリア ＋ メンバーリスト表示用コンテナ -->
        <div id="chat-logs"></div>
        
        <!-- メンバータブ選択時に表示する専用コンテナ（初期非表示） -->
        <div id="room-members-container" style="display: none; flex: 1; padding: 10px; overflow-y: auto; font-size: 0.85rem;">
          <div style="font-weight: bold; margin-bottom: 6px; color: var(--accent-gold);">ルーム参加メンバー</div>
          <ul id="room-member-list" style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px;">
            <li style="color: var(--text-muted); font-size: 0.75rem;">読み込み中...</li>
          </ul>
        </div>

        <div class="chat-input-area" id="chat-input-area-box">
          <select id="chat-speaker-select" style="background:var(--bg-main); color:var(--text-main); border:1px solid var(--border-color); border-radius:4px; max-width:80px;">
            <option value="GM">GM</option>
          </select>
          <input type="text" id="chat-input" placeholder="ダイス例: 7dx+3@8 または メッセージ" onkeydown="if(event.key==='Enter') sendMessage()">
          <button class="btn btn-red" onclick="sendMessage()">送信</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="gm-modal">
  <div class="modal-card">
    <div style="font-weight:bold; margin-bottom:6px; display:flex; justify-content:space-between; font-size:0.85rem;">
      <span id="modal-char-name">BS編集</span>
      <button class="btn" onclick="closeModal()">✕</button>
    </div>
    <div class="bs-toggle-grid" id="modal-bs-grid"></div>
    <div style="margin-top:10px; text-align:right;">
      <button class="btn btn-red" onclick="closeModal()">閉じる</button>
    </div>
  </div>
</div>

<!-- エフェクト登録モーダル -->
<div id="effect-modal" class="modal-overlay">
  <div class="modal-content" style="max-width: 600px; width: 92%; background: #131722; color: #fff; padding: 20px; border-radius: 8px; border: 1px solid #2a2f3a; box-sizing: border-box; max-height: 90vh; overflow-y: auto;">
    
    <div style="font-weight: bold; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2f3a; padding-bottom: 8px;">
      <span style="font-size: 1.1em;">新規エフェクト登録（マスターデータ作成）</span>
      <button class="btn" onclick="closeEffectModal()" style="background: #4a5568; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer;">✕</button>
    </div>

    <div style="display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap;">
      <label style="flex: 1; min-width: 140px; font-size: 0.85em;">シンドローム:
        <select id="eff-syndrome" onchange="updateEffectIdAuto()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:6px; border-radius:4px; margin-top:2px;">
          <option value="ang">エンジェルハイロゥ (ang)</option>
          <option value="bal">バロール (bal)</option>
          <option value="bdg">ブラックドッグ (bdg)</option>
          <option value="bld">ブラム＝ストーカー (bld)</option>
          <option value="cym">キュマイラ (cym)</option>
          <option value="exg">エグザイル (exg)</option>
          <option value="hnm">ハヌマーン (hnm)</option>
          <option value="mol">モルフェウス (mol)</option>
          <option value="num">オルクス (num)</option>
          <option value="ork">サラマンダー (ork)</option>
          <option value="slm">ノイマン (slm)</option>
          <option value="slr">ソラリス (slr)</option>
          <option value="uro">ウロボロス (uro)</option>
          <option value="gen">汎用 (gen)</option>
        </select>
      </label>
      <label style="flex: 1; min-width: 100px; font-size: 0.85em;">ID:
        <input type="text" id="eff-id" readonly style="width:100%; background:#1a1d24; color:#a0aec0; border:1px solid #2a2f3a; padding:6px; border-radius:4px; margin-top:2px; box-sizing: border-box;">
      </label>
    </div>

    <div style="display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap;">
      <label style="flex: 2; min-width: 160px; font-size: 0.85em;">エフェクト名:
        <input type="text" id="eff-name" placeholder="例: 見えざる死神" oninput="generateEffectJson()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:6px; border-radius:4px; margin-top:2px; box-sizing: border-box;">
      </label>
      <label style="flex: 1; min-width: 70px; font-size: 0.85em;">最大Lv:
        <input type="number" id="eff-max-level" value="1" min="1" oninput="generateEffectJson()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:6px; border-radius:4px; margin-top:2px; box-sizing: border-box;">
      </label>
    </div>

    <div style="display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap;">
      <label style="flex: 1; min-width: 130px; font-size: 0.85em;">タイミング:
        <select id="eff-timing" onchange="generateEffectJson()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:6px; border-radius:4px; margin-top:2px;">
          <option value="メジャーアクション">メジャーアクション</option>
          <option value="マイナーアクション">マイナーアクション</option>
          <option value="セットアップ">セットアップ</option>
          <option value="イニシアチブ">イニシアチブ</option>
          <option value="オートアクション">オートアクション</option>
          <option value="クリンナップ">クリンナップ</option>
          <option value="常時">常時</option>
        </select>
      </label>
      <label style="flex: 1; min-width: 100px; font-size: 0.85em;">技能:
        <input type="text" id="eff-skill" value="&lt;RC&gt;" oninput="generateEffectJson()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:6px; border-radius:4px; margin-top:2px; box-sizing: border-box;">
      </label>
    </div>

    <div style="display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap;">
      <label style="flex: 1; min-width: 90px; font-size: 0.85em;">難易度:
        <input type="text" id="eff-difficulty" value="自動成功" oninput="generateEffectJson()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:6px; border-radius:4px; margin-top:2px; box-sizing: border-box;">
      </label>
      <label style="flex: 1.2; min-width: 110px; font-size: 0.85em;">対象:
        <select id="eff-target-type-sel" onchange="generateEffectJson()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:6px; border-radius:4px; margin-top:2px;">
          <option value="-">- (組み合わせ依存)</option>
          <option value="自身">自身</option>
          <option value="単体">単体</option>
          <option value="範囲">範囲</option>
          <option value="範囲(選択)">範囲(選択)</option>
          <option value="シーン">シーン</option>
          <option value="シーン(選択)">シーン(選択)</option>
        </select>
      </label>
      <label style="flex: 1; min-width: 90px; font-size: 0.85em;">射程:
        <input type="text" id="eff-range" value="視界" oninput="generateEffectJson()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:6px; border-radius:4px; margin-top:2px; box-sizing: border-box;">
      </label>
    </div>

    <div style="display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap;">
      <label style="flex: 1; min-width: 110px; font-size: 0.85em;">侵蝕値:
        <input type="text" id="eff-encroach" value="2" oninput="generateEffectJson()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:6px; border-radius:4px; margin-top:2px; box-sizing: border-box;">
      </label>
      <label style="flex: 1; min-width: 110px; font-size: 0.85em;">制限:
        <input type="text" id="eff-limit" value="-" oninput="generateEffectJson()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:6px; border-radius:4px; margin-top:2px; box-sizing: border-box;">
      </label>
    </div>

    <div style="border: 1px dashed #3a4253; padding: 10px; border-radius: 6px; margin-top: 10px; background: #0f1218;">
      <div style="font-weight: bold; font-size: 0.85em; color: #8a99ad; margin-bottom: 6px;">■ 効果モジュール追加（複数登録可能）</div>
      
      <div style="display: flex; gap: 6px; align-items: center; margin-bottom: 6px; flex-wrap: wrap;">
        <select id="eff-stat" style="flex: 2; min-width: 140px; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:6px; border-radius:4px;">
          <optgroup label="ステータス補正">
            <option value="dice">ダイス (dice)</option>
            <option value="crit">C値 (crit)</option>
            <option value="atk">攻撃力 (atk)</option>
            <option value="hp">HP変動 (hp)</option>
            <option value="encroach">追加侵蝕率 (encroach)</option>
            <option value="guard">ガード値 (guard)</option>
            <option value="armor">装甲値 (armor)</option>
          </optgroup>
          <optgroup label="判定能力値・技能変更">
            <option value="change_attr_body">判定能力値: 肉体</option>
            <option value="change_attr_sense">判定能力値: 感覚</option>
            <option value="change_attr_mind">判定能力値: 精神</option>
            <option value="change_attr_social">判定能力値: 社会</option>
            <option value="change_skill">技能変更 (change_skill)</option>
          </optgroup>
          <optgroup label="対象・射程変更/制限">
            <option value="range_override">射程変更 (range_override)</option>
            <option value="target_override">対象変更 (target_override)</option>
            <option value="range_lock">射程変更不可 (range_lock)</option>
            <option value="target_lock">対象変更不可 (target_lock)</option>
          </optgroup>
          <optgroup label="判定・バトル特殊効果">
            <option value="ignore_armor">装甲無視 (ignore_armor)</option>
            <option value="disable_reaction">リアクション不可 (disable_reaction)</option>
            <option value="force_crit">強制クリティカル (force_crit)</option>
            <option value="wipe_troop">トループ一掃 (wipe_troop)</option>
            <option value="apply_debuff">デバフ付与 (apply_debuff)</option>
            <option value="cure_debuff">デバフ解除 (cure_debuff)</option>
          </optgroup>
          <optgroup label="特殊・ギミック">
            <option value="fusion">融合 (fusion)</option>
            <option value="summon_servant">赤色の従者/召喚 (summon_servant)</option>
            <option value="copy_effect">コピー/ウロボロス (copy_effect)</option>
          </optgroup>
        </select>

        <input type="text" id="eff-calc" placeholder="例: level * 3" value="level * 3" style="flex: 1.2; min-width: 90px; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:6px; border-radius:4px; box-sizing: border-box;">

        <button type="button" onclick="addModificationItem()" style="background: #2b5278; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; white-space: nowrap;">＋効果追加</button>
      </div>

      <ul id="eff-mod-list" style="margin: 6px 0 0 0; padding-left: 18px; color: #cbd5e0; font-size: 0.85em;"></ul>
    </div>

    <div style="margin-top: 12px;">
      <label style="font-size: 0.85em; color: #8a99ad;">JSONプレビュー:</label>
      <textarea id="eff-json-output" readonly style="width: 100%; height: 110px; background: #0b0d12; color: #48bb78; border: 1px solid #2a2f3a; border-radius: 4px; font-family: monospace; font-size: 0.8em; margin-top: 4px; box-sizing: border-box;"></textarea>
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px;">
      <button type="button" onclick="downloadEffectsJson()" style="background: #38a169; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.9em;">JSONダウンロード</button>
      <button type="button" onclick="closeEffectModal()" style="background: #4a5568; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.9em;">閉じる</button>
    </div>
  </div>
</div>

  <!-- スクリプトの分割読み込み（依存関係の順） -->
  <script src="main.js"></script>     <!-- 共通変数、キャラクター管理、初期化など -->
  <script src="effects.js"></script>  <!-- エフェクト関連、逆引き辞書、登録モーダルなど -->
  <script src="battle.js"></script>   <!-- フェーズ・戦闘プロセス管理など -->
  <script src="board.js"></script>    <!-- トークン移動、マップのズーム・パンなど -->
  
  <!-- チャットおよびルーム固有ロジック（モジュール構造維持版） -->
  <script type="module">
    import { supabase } from './config.js';
    import { initChatSystem, switchChatTab, toggleChatPanel } from './chat.js';

    // グローバル公開（HTMLの onclick から呼び出すため）
    window.switchChatTab = function(tabKey) {
      const logsEl = document.getElementById('chat-logs');
      const membersEl = document.getElementById('room-members-container');
      const inputAreaEl = document.getElementById('chat-input-area-box');

      if (tabKey === 'members') {
        if (logsEl) logsEl.style.display = 'none';
        if (inputAreaEl) inputAreaEl.style.display = 'none';
        if (membersEl) membersEl.style.display = 'flex';
        
        // タブのアクティブ状態切替
        document.querySelectorAll('.chat-tab').forEach(t => t.classList.remove('active'));
        event.currentTarget.classList.add('active');
        fetchRoomMembers();
      } else {
        if (logsEl) logsEl.style.display = 'flex';
        if (inputAreaEl) inputAreaEl.style.display = 'flex';
        if (membersEl) membersEl.style.display = 'none';
        switchChatTab(tabKey);
      }
    };

    window.toggleChatPanel = toggleChatPanel;

    // ① ルームIDの固着問題解消：URLパラメータからルームIDを確実に取得
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room');
    const playerId = localStorage.getItem('player_id');
    const playerName = localStorage.getItem('player_name');

    if (!playerId) {
      alert('ログインしてください。');
      window.location.href = 'index.html';
    }

    if (!roomId) {
      alert('ルームIDが指定されていません。');
      window.location.href = 'rooms.html';
    }

    // 💡 roomsテーブルのUUIDからルーム名(name)を逆引きしてチャットセッションIDに合わせる処理
    async function initSession() {
      let chatSessionId = roomId; // 万が一取得できなかった場合のフォールバック

      const { data: roomData, error } = await supabase
        .from('rooms')
        .select('name')
        .eq('id', roomId)
        .single();

      if (!error && roomData && roomData.name) {
        chatSessionId = roomData.name; // 例: "test01" などのルーム名を取得
      }

      // チャットシステムへ確定したセッションIDを引き渡して初期化
      initChatSystem(supabase, chatSessionId, playerName);
    }

    initSession();

    // ルームメンバーリストの取得関数
    async function fetchRoomMembers() {
      const memberListUl = document.getElementById('room-member-list');
      if (!memberListUl) return;

      const { data: members, error } = await supabase
        .from('players')
        .select('name, is_online, current_room_id')
        .eq('is_online', true)
        .eq('current_room_id', roomId);

      if (error || !members || members.length === 0) {
        memberListUl.innerHTML = `<li style="color: var(--text-muted); font-size: 0.75rem;">参加中のメンバーがいません</li>`;
        return;
      }

      memberListUl.innerHTML = '';
      members.forEach(m => {
        const li = document.createElement('li');
        li.style.cssText = "background: var(--bg-main); border: 1px solid var(--border-color); padding: 6px 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem;";
        li.innerHTML = `<span>🟢 ${m.name}</span>`;
        memberListUl.appendChild(li);
      });
    }

    // 在室ステータス（ハートビート）の更新
    async function updatePresence() {
      await supabase
        .from('players')
        .update({ is_online: true, current_room_id: roomId, last_seen_at: new Date().toISOString() })
        .eq('id', playerId);
    }
    updatePresence();
    setInterval(updatePresence, 5000);

    // ロビーに戻るボタン
    document.getElementById('leave-room-btn').addEventListener('click', async () => {
      await supabase
        .from('players')
        .update({ current_room_id: null })
        .eq('id', playerId);
      window.location.href = 'rooms.html';
    });

    // ② ダークモード / ライトモード切り替え機能の横展開
    const htmlTag = document.documentElement;
    const toggleBtn = document.getElementById('toggle-theme');

    function setTheme(theme) {
      htmlTag.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      toggleBtn.textContent = theme === 'dark' ? 'ライトモード' : 'ダークモード';
    }

    setTheme(localStorage.getItem('theme') || 'dark');
    toggleBtn.addEventListener('click', () => {
      setTheme(htmlTag.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });
  </script>
</body>
</html>

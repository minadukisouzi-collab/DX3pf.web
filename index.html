<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DX3rd Online Session Platform</title>
  <link rel="stylesheet" href="style.css">
  <meta name="robots" content="noindex, nofollow">
</head>
<body>

<div id="app-container">
  <header>
    <div class="title-logo">DX3rd VTT</div>
    <div class="timeline-bar">
      <div class="timeline-item">
        <span style="color:var(--accent-gold); font-weight:bold;">Phase:</span>
        <span id="current-phase-text" style="color:#fff;">オープニングフェイズ</span>
      </div>
      <div class="timeline-item"><span>Sc:</span> <input type="number" id="scene-num" value="1" style="width:25px; background:transparent; color:#fff; border:none;" readonly></div>
      <div class="timeline-item"><span>Rd:</span> <input type="number" id="round-num" value="1" style="width:25px; background:transparent; color:#fff; border:none;" readonly></div>
      
      <!-- 通常モード / 戦闘モードの切り替えエリア -->
      <div id="mode-controls" style="display:flex; gap:4px; align-items:center;"></div>
    </div>
  </header>

  <div id="main-content">
    <div id="char-sidebar">
      <div class="sidebar-section">
        <!-- キャラクター一覧タイトルの部分 -->
          <div class="sidebar-title">
             <span>キャラクター一覧</span>
               <div style="display:flex; gap:4px;">
                  <button class="btn btn-purple" onclick="openEffectModal()" style="font-size:0.7rem;">+ エフェクト追加</button>
    <button class="btn" onclick="addCharacter()">+ キャラ追加</button>
  </div>
</div>
        <div id="character-list"></div>
      </div>
    </div>

    <div id="center-right-area">
      <div id="board-wrapper">
        <div class="board-controls">
          <button class="btn" onclick="zoomBoard(0.1)">＋</button>
          <button class="btn" onclick="zoomBoard(-0.1)">－</button>
          <button class="btn" onclick="resetBoardView()">リセット</button>
        </div>
        <div id="board-viewport"></div>
      </div>

      <div id="chat-wrapper">
        <div class="chat-tabs-bar">
          <div class="chat-tabs" id="chat-tabs-list">
            <div class="chat-tab active" onclick="switchChatTab('main')">メイン</div>
            <div class="chat-tab" onclick="switchChatTab('sub')">雑談</div>
            <div class="chat-tab" onclick="switchChatTab('info')">情報</div>
          </div>
          <button class="chat-toggle-btn" id="chat-toggle-btn" onclick="toggleChatPanel()">▼ 畳む</button>
        </div>
        
        <div id="chat-logs"></div>

        <div class="chat-input-area">
          <select id="chat-speaker-select" style="background:#0b0d12; color:#fff; border:1px solid #2a2f3a; border-radius:4px; max-width:80px;">
            <option value="GM">GM</option>
          </select>
          <input type="text" id="chat-input" placeholder="ダイス例: 7dx+3@8 または メッセージ" onkeydown="if(event.key==='Enter') sendMessage()">
          <button class="btn btn-red" onclick="sendMessage()">送信</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="gm-modal">
  <div class="modal-card">
    <div style="font-weight:bold; margin-bottom:6px; display:flex; justify-content:space-between; font-size:0.85rem;">
      <span id="modal-char-name">BS編集</span>
      <button class="btn" onclick="closeModal()">✕</button>
    </div>
    <div class="bs-toggle-grid" id="modal-bs-grid"></div>
    <div style="margin-top:10px; text-align:right;">
      <button class="btn btn-red" onclick="closeModal()">閉じる</button>
    </div>
  </div>
</div>
<!-- 新規エフェクト登録モーダル -->
<div class="modal-overlay" id="effect-modal">
  <div class="modal-card" style="max-height: 90vh; overflow-y: auto;">
    <div style="font-weight:bold; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; font-size:0.9rem;">
      <span>新規エフェクト登録（マスターデータ作成）</span>
      <button class="btn" onclick="closeEffectModal()" style="font-size:0.7rem; padding:2px 6px;">✕</button>
    </div>
    
    <div style="display:flex; flex-direction:column; gap:6px; font-size:0.75rem;">
      <label>シンドローム:
        <select id="eff-syndrome" onchange="updateEffectIdAuto()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:4px; border-radius:4px;">
          <option value="ang">エンジェルハイロゥ (ang)</option>
          <option value="bal">バロール (bal)</option>
          <option value="bdg">ブラックドッグ (bdg)</option>
          <option value="bld">ブラム＝ストーカー (bld)</option>
          <option value="cym">キュマイラ (cym)</option>
          <option value="exg">エグザイル (exg)</option>
          <option value="hnm">ハヌマーン (hnm)</option>
          <option value="mol">モルフェウス (mol)</option>
          <option value="num">オルクス (num)</option>
          <option value="ork">サラマンダー (ork)</option>
          <option value="slm">ノイマン (slm)</option>
          <option value="slr">ソラリス (slr)</option>
          <option value="uro">ウロボロス (uro)</option>
          <option value="gen">汎用 (gen)</option>
</select>

      </label>

      <label>ID (自動採番):
        <input type="text" id="eff-id" readonly style="width:100%; background:#1a1c23; color:#aaa; border:1px solid #2a2f3a; padding:4px; border-radius:4px;">
      </label>

      <label>エフェクト名:
        <input type="text" id="eff-name" value="" placeholder="例: 虚空の弾丸" oninput="generateEffectJson()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:4px; border-radius:4px;">
      </label>

      <div style="display:flex; gap:6px;">
        <label style="flex:1;">最大Lv:
          <input type="number" id="eff-max-level" value="1" min="1" oninput="generateEffectJson()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:4px; border-radius:4px;">
        </label>
<label>タイミング:
  <select id="eff-timing" onchange="generateEffectJson()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:4px; border-radius:4px;">
    <option value="メジャーアクション">メジャーアクション</option>
    <option value="マイナーアクション">マイナーアクション</option>
    <option value="セットアップ">セットアップ</option>
    <option value="イニシアチブ">イニシアチブ</option>
    <option value="オートアクション">オートアクション</option>
    <option value="クリンナップ">クリンナップ</option>
    <option value="常時">常時</option>
  </select>
</label>

      </div>

      <div style="display:flex; gap:6px;">
        <label style="flex:1;">スキル:
          <input type="text" id="eff-skill" value="<RC>" oninput="generateEffectJson()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:4px; border-radius:4px;">
        </label>
        <label style="flex:1;">難易度:
          <input type="text" id="eff-difficulty" value="自動成功" oninput="generateEffectJson()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:4px; border-radius:4px;">
        </label>
      </div>

      <div style="display:flex; gap:6px;">
        <label style="flex:1;">対象:
          <select id="eff-target-type-sel" onchange="generateEffectJson()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:4px; border-radius:4px;">
            <option value="-">- (自身)</option>
            <option value="単体">単体</option>
            <option value="範囲">範囲</option>
          </select>
        </label>
        <label style="flex:1;">射程:
          <input type="text" id="eff-range" value="視界" oninput="generateEffectJson()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:4px; border-radius:4px;">
        </label>
      </div>

      <div style="display:flex; gap:6px;">
        <label style="flex:1;">侵蝕コスト:
          <input type="text" id="eff-encroach" value="2" oninput="generateEffectJson()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:4px; border-radius:4px;">
        </label>
        <label style="flex:1;">制限:
          <input type="text" id="eff-limit" value="-" oninput="generateEffectJson()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:4px; border-radius:4px;">
        </label>
      </div>

      <div style="border-top:1px solid #2a2f3a; padding-top:4px; margin-top:2px; font-weight:bold;">効果モジュール設定</div>
      <div style="display:flex; gap:6px;">
        <label>変動ステータス:
  <select id="eff-stat" onchange="generateEffectJson()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:4px; border-radius:4px;">
    <option value="dice">ダイス (dice)</option>
    <option value="crit">C値 (crit)</option>
    <option value="atk">攻撃力 (atk)</option>
    <option value="hp">HP変動 (hp)</option>
    <option value="encroach">侵蝕率 (encroach)</option>
    <option value="guard">ガード値 (guard)</option>
    <option value="armor">装甲値 (armor)</option>
  </select>
</label>
        </label>
        <label style="flex:1;">計算式:
          <input type="text" id="eff-calc" value="level * 2" oninput="generateEffectJson()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:4px; border-radius:4px;">
        </label>
      </div>

      <label>生成されるJSONプレビュー:
        <textarea id="eff-json-output" readonly style="width:100%; height:80px; background:#0b0d12; color:#7ec8e3; border:1px solid #2a2f3a; font-family:monospace; font-size:0.65rem; padding:4px; border-radius:4px;"></textarea>
      </label>

      <button class="btn btn-gold" onclick="downloadEffectsJson()" style="width:100%; margin-top:4px; padding:6px; font-weight:bold;">JSONをダウンロード</button>
    </div>
  </div>
</div>

  <!-- スクリプトの分割読み込み（依存関係の順） -->
  <script src="main.js"></script>     <!-- 共通変数、キャラクター管理、初期化など -->
  <script src="effects.js"></script>  <!-- エフェクト関連、逆引き辞書、登録モーダルなど -->
  <script src="battle.js"></script>   <!-- フェーズ・戦闘プロセス管理など -->
  <script src="board.js"></script>    <!-- トークン移動、マップのズーム・パンなど -->
  <script src="chat.js"></script>     <!-- チャット、タブ切替、ダイスロールなど -->
</body>
</html>

<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>DX3rd VTT - ログイン</title>
  <style>
    /* 🎨 カラーテーマの定義（CSS変数）: VTT本体に寄せたダーク＆レッド基調 */
    :root[data-theme="dark"] {
      --bg-color: #0b0b0e;
      --card-bg: #16161c;
      --text-color: #e2e2ec;
      --input-bg: #22222d;
      --input-border: #333342;
      --accent-color: #ff2a2a; /* 鮮やかな赤 */
      --accent-hover: #e01b1b;
      --btn-text: #ffffff;
      --card-shadow: 0 4px 20px rgba(255, 42, 42, 0.15);
    }

    :root[data-theme="light"] {
      --bg-color: #f0f0f5;
      --card-bg: #ffffff;
      --text-color: #2b2b36;
      --input-bg: #f9f9fc;
      --input-border: #d0d0d8;
      --accent-color: #d90429;
      --accent-hover: #b70322;
      --btn-text: #ffffff;
      --card-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    body {
      font-family: sans-serif, Meiryo;
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 400px;
      margin: 60px auto;
      padding: 20px;
      transition: background 0.3s, color 0.3s;
    }

    .card {
      background: var(--card-bg);
      padding: 30px 25px;
      border-radius: 6px;
      box-shadow: var(--card-shadow);
      border-top: 3px solid var(--accent-color);
      position: relative;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 5px;
      letter-spacing: 1.5px;
      font-size: 1.5rem;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      box-sizing: border-box;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-color);
      border-radius: 4px;
      font-size: 1rem;
    }
    input:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: var(--accent-color);
      color: var(--btn-text);
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover {
      background: var(--accent-hover);
    }
    button:active {
      transform: scale(0.99);
    }

    button.register {
      background: transparent;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
    }
    button.register:hover {
      background: var(--accent-color);
      color: var(--btn-text);
    }

    #message {
      color: var(--accent-color);
      margin-top: 15px;
      font-size: 0.9em;
      text-align: center;
    }

    /* モード切り替えボタン */
    .theme-toggle {
      position: absolute;
      top: 25px;
      right: 25px;
      background: transparent;
      border: 1px solid var(--input-border);
      color: var(--text-color);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      width: auto;
      font-size: 0.75rem;
      font-weight: normal;
    }
    .theme-toggle:hover {
      background: var(--input-bg);
      border-color: var(--accent-color);
    }
  </style>
</head>
<body>

  <div class="card">
    <button class="theme-toggle" id="toggle-theme">☀️ ライトモードへ</button>
    
    <h2>DX3rd VTT</h2>
    <p style="font-size: 0.85rem; opacity: 0.7; margin-bottom: 25px;">プレイヤー認証 / ログイン</p>
    
    <input type="text" id="username" placeholder="プレイヤー名">
    <input type="password" id="passcode" placeholder="パスコード">
    
    <button id="login-btn">ログイン</button>
    <button id="register-btn" class="register">新規アカウント登録</button>
    
    <div id="message"></div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js'

    const SUPABASE_URL = 'YOUR_SUPABASE_URL'
    const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY'
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

    const htmlTag = document.documentElement;
    const toggleBtn = document.getElementById('toggle-theme');
    
    // テーマ適用とボタン文言を更新する関数
    function setTheme(theme) {
      htmlTag.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      if (theme === 'dark') {
        toggleBtn.textContent = '☀️ ライトモードへ';
      } else {
        toggleBtn.textContent = '🌙 ダークモードへ';
      }
    }

    // 初期テーマのロード（保存されているもの、なければダーク）
    const savedTheme = localStorage.getItem('theme') || 'dark';
    setTheme(savedTheme);

    // 切替ボタンのクリックイベント
    toggleBtn.addEventListener('click', () => {
      const currentTheme = htmlTag.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      setTheme(newTheme);
    });

    const nameInput = document.getElementById('username');
    const passInput = document.getElementById('passcode');
    const msgDiv = document.getElementById('message');

    // ログイン処理
    document.getElementById('login-btn').addEventListener('click', async () => {
      const name = nameInput.value.trim();
      const passcode = passInput.value.trim();
      if (!name || !passcode) {
        msgDiv.textContent = '名前とパスコードを入力してください。';
        return;
      }

      const { data, error } = await supabase
        .from('players')
        .select('*')
        .eq('name', name)
        .eq('passcode', passcode)
        .single();

      if (error || !data) {
        msgDiv.textContent = 'ユーザーが見つからないか、パスコードが違います。';
        return;
      }

      localStorage.setItem('player_id', data.id);
      localStorage.setItem('player_name', data.name);

      alert(`おかえりなさい、${data.name}さん！`);
      // window.location.href = 'rooms.html'; // ルーム選択画面へ
    });

    // 新規登録処理
    document.getElementById('register-btn').addEventListener('click', async () => {
      const name = nameInput.value.trim();
      const passcode = passInput.value.trim();
      if (!name || !passcode) {
        msgDiv.textContent = '登録する名前とパスコードを入力してください。';
        return;
      }

      const { data: existing } = await supabase
        .from('players')
        .select('id')
        .eq('name', name)
        .single();

      if (existing) {
        msgDiv.textContent = 'その名前はすでに使われています。';
        return;
      }

      const { data, error } = await supabase
        .from('players')
        .insert([{ name: name, passcode: passcode }])
        .select()
        .single();

      if (error) {
        msgDiv.textContent = '登録エラー: ' + error.message;
        return;
      }

      localStorage.setItem('player_id', data.id);
      localStorage.setItem('player_name', data.name);

      alert(`アカウントを作成しました！ようこそ、${data.name}さん！`);
      // window.location.href = 'rooms.html';
    });
  </script>
</body>
</html>

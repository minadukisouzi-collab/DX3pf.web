<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DX3rd Online Session Platform</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app-container">
  <header>
    <div class="title-logo">DX3rd VTT</div>
    <div class="timeline-bar">
      <div class="timeline-item">
        <span style="color:var(--accent-gold); font-weight:bold;">Phase:</span>
        <span id="current-phase-text" style="color:#fff;">オープニングフェイズ</span>
      </div>
      <div class="timeline-item"><span>Sc:</span> <input type="number" id="scene-num" value="1" style="width:25px; background:transparent; color:#fff; border:none;" readonly></div>
      <div class="timeline-item"><span>Rd:</span> <input type="number" id="round-num" value="1" style="width:25px; background:transparent; color:#fff; border:none;" readonly></div>
      
      <!-- 通常モード / 戦闘モードの切り替えエリア -->
      <div id="mode-controls" style="display:flex; gap:4px; align-items:center;"></div>
    </div>
  </header>

  <div id="main-content">
    <div id="char-sidebar">
      <div class="sidebar-section">
        <!-- キャラクター一覧タイトルの部分 -->
          <div class="sidebar-title">
             <span>キャラクター一覧</span>
               <div style="display:flex; gap:4px;">
                  <button class="btn btn-purple" onclick="openEffectModal()" style="font-size:0.7rem;">+ エフェクト追加</button>
    <button class="btn" onclick="addCharacter()">+ キャラ追加</button>
  </div>
</div>
        <div id="character-list"></div>
      </div>
    </div>

    <div id="center-right-area">
      <div id="board-wrapper">
        <div class="board-controls">
          <button class="btn" onclick="zoomBoard(0.1)">＋</button>
          <button class="btn" onclick="zoomBoard(-0.1)">－</button>
          <button class="btn" onclick="resetBoardView()">リセット</button>
        </div>
        <div id="board-viewport"></div>
      </div>

      <div id="chat-wrapper">
        <div class="chat-tabs-bar">
          <div class="chat-tabs" id="chat-tabs-list">
            <div class="chat-tab active" onclick="switchChatTab('main')">メイン</div>
            <div class="chat-tab" onclick="switchChatTab('sub')">雑談</div>
            <div class="chat-tab" onclick="switchChatTab('info')">情報</div>
          </div>
          <button class="chat-toggle-btn" id="chat-toggle-btn" onclick="toggleChatPanel()">▼ 畳む</button>
        </div>
        
        <div id="chat-logs"></div>

        <div class="chat-input-area">
          <select id="chat-speaker-select" style="background:#0b0d12; color:#fff; border:1px solid #2a2f3a; border-radius:4px; max-width:80px;">
            <option value="GM">GM</option>
          </select>
          <input type="text" id="chat-input" placeholder="ダイス例: 7dx+3@8 または メッセージ" onkeydown="if(event.key==='Enter') sendMessage()">
          <button class="btn btn-red" onclick="sendMessage()">送信</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="gm-modal">
  <div class="modal-card">
    <div style="font-weight:bold; margin-bottom:6px; display:flex; justify-content:space-between; font-size:0.85rem;">
      <span id="modal-char-name">BS編集</span>
      <button class="btn" onclick="closeModal()">✕</button>
    </div>
    <div class="bs-toggle-grid" id="modal-bs-grid"></div>
    <div style="margin-top:10px; text-align:right;">
      <button class="btn btn-red" onclick="closeModal()">閉じる</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
<!-- エフェクト登録モーダル -->
<div class="modal-overlay" id="effect-modal">
  <div class="modal-card" style="width: 480px;">
    <div style="font-weight:bold; margin-bottom:10px; display:flex; justify-content:space-between; font-size:0.9rem;">
      <span>新規エフェクト登録（マスターデータ作成）</span>
      <button class="btn" onclick="closeEffectModal()">✕</button>
    </div>
    
    <div style="display:flex; flex-direction:column; gap:8px; font-size:0.8rem;">
      <div>
        <span>エフェクトID (半角英数):</span>
        <input type="text" id="eff-id" placeholder="例: siren_witch" style="width:100%; background:var(--bg-main); border:1px solid var(--border-color); color:#fff; padding:4px; border-radius:4px; margin-top:2px;">
      </div>
      <div>
        <span>エフェクト名 (日本語):</span>
        <input type="text" id="eff-name" placeholder="例: サイレンの魔女" style="width:100%; background:var(--bg-main); border:1px solid var(--border-color); color:#fff; padding:4px; border-radius:4px; margin-top:2px;">
      </div>
      <div style="display:flex; gap:8px;">
        <div style="flex:1;">
          <span>タイミング:</span>
          <input type="text" id="eff-timing" value="メジャー" style="width:100%; background:var(--bg-main); border:1px solid var(--border-color); color:#fff; padding:4px; border-radius:4px; margin-top:2px;">
        </div>
        <div style="flex:1;">
          <span>侵蝕率コスト:</span>
          <input type="number" id="eff-encroach" value="3" style="width:100%; background:var(--bg-main); border:1px solid var(--border-color); color:#fff; padding:4px; border-radius:4px; margin-top:2px;">
        </div>
      </div>
      
      <div style="border-top:1px solid var(--border-color); padding-top:8px; margin-top:4px;">
        <span style="font-weight:bold; color:var(--accent-gold);">効果（変動値設定）:</span>
        <div style="display:flex; gap:8px; margin-top:4px;">
          <div style="flex:1;">
            <span>対象ステータス:</span>
            <select id="eff-stat" style="width:100%; background:var(--bg-main); border:1px solid var(--border-color); color:#fff; padding:4px; border-radius:4px; margin-top:2px;">
              <option value="dice">ダイス数 (dice)</option>
              <option value="crit">クリティカル値 (crit)</option>
              <option value="atk">攻撃力 (atk)</option>
            </select>
          </div>
          <div style="flex:1;">
            <span>計算式:</span>
            <input type="text" id="eff-calc" placeholder="例: level * 2" value="level * 2" style="width:100%; background:var(--bg-main); border:1px solid var(--border-color); color:#fff; padding:4px; border-radius:4px; margin-top:2px;">
          </div>
        </div>
      </div>

      <div>
        <span>生成された JSON プレビュー / 出力:</span>
        <textarea id="eff-json-output" readonly style="width:100%; height:80px; background:#050608; border:1px solid var(--border-color); color:#a8dadc; font-family:monospace; font-size:0.75rem; padding:4px; border-radius:4px; margin-top:2px;"></textarea>
      </div>
    </div>

    <div style="margin-top:12px; display:flex; justify-content:space-between; align-items:center;">
      <button class="btn" onclick="generateEffectJson()">JSONをプレビュー生成</button>
      <div style="display:flex; gap:4px;">
        <button class="btn btn-gold" onclick="downloadEffectsJson()">JSONファイルをダウンロード</button>
        <button class="btn btn-red" onclick="closeEffectModal()">閉じる</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>

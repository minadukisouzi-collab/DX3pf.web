<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DX3rd Online Session Platform</title>
  <link rel="stylesheet" href="style.css">
  <meta name="robots" content="noindex, nofollow">
</head>
<body>

<div id="app-container">
  <header>
    <div class="title-logo">DX3rd VTT</div>
    <div class="timeline-bar">
      <div class="timeline-item">
        <span style="color:var(--accent-gold); font-weight:bold;">Phase:</span>
        <span id="current-phase-text" style="color:#fff;">オープニングフェイズ</span>
      </div>
      <div class="timeline-item"><span>Sc:</span> <input type="number" id="scene-num" value="1" style="width:25px; background:transparent; color:#fff; border:none;" readonly></div>
      <div class="timeline-item"><span>Rd:</span> <input type="number" id="round-num" value="1" style="width:25px; background:transparent; color:#fff; border:none;" readonly></div>
      
      <!-- 通常モード / 戦闘モードの切り替えエリア -->
      <div id="mode-controls" style="display:flex; gap:4px; align-items:center;"></div>
    </div>
  </header>

  <div id="main-content">
    <div id="char-sidebar">
      <div class="sidebar-section">
        <!-- キャラクター一覧タイトルの部分 -->
          <div class="sidebar-title">
             <span>キャラクター一覧</span>
             <div style="display:flex; gap:4px;">
                  <button class="btn btn-purple" onclick="openEffectModal()" style="font-size:0.7rem;">+ エフェクト追加</button>
                  <button class="btn" onclick="addCharacter()">+ キャラ追加</button>
            </div>
          </div>
        <div id="character-list"></div>
      </div>
    </div>

    <div id="center-right-area">
      <div id="board-wrapper">
        <div class="board-controls">
          <button class="btn" onclick="zoomBoard(0.1)">＋</button>
          <button class="btn" onclick="zoomBoard(-0.1)">－</button>
          <button class="btn" onclick="resetBoardView()">リセット</button>
        </div>
        <div id="board-viewport"></div>
      </div>

      <div id="chat-wrapper">
        <div class="chat-tabs-bar">
          <div class="chat-tabs" id="chat-tabs-list">
            <div class="chat-tab active" onclick="switchChatTab('main')">メイン</div>
            <div class="chat-tab" onclick="switchChatTab('sub')">雑談</div>
            <div class="chat-tab" onclick="switchChatTab('info')">情報</div>
          </div>
          <button class="chat-toggle-btn" id="chat-toggle-btn" onclick="toggleChatPanel()">▼ 畳む</button>
        </div>
        <div id="chat-logs"></div>
        <div class="chat-input-area">
          <select id="chat-speaker-select" style="background:#0b0d12; color:#fff; border:1px solid #2a2f3a; border-radius:4px; max-width:80px;">
            <option value="GM">GM</option>
          </select>
          <input type="text" id="chat-input" placeholder="ダイス例: 7dx+3@8 または メッセージ" onkeydown="if(event.key==='Enter') sendMessage()">
          <button class="btn btn-red" onclick="sendMessage()">送信</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="gm-modal">
  <div class="modal-card">
    <div style="font-weight:bold; margin-bottom:6px; display:flex; justify-content:space-between; font-size:0.85rem;">
      <span id="modal-char-name">BS編集</span>
      <button class="btn" onclick="closeModal()">✕</button>
    </div>
    <div class="bs-toggle-grid" id="modal-bs-grid"></div>
    <div style="margin-top:10px; text-align:right;">
      <button class="btn btn-red" onclick="closeModal()">閉じる</button>
    </div>
  </div>
</div>
<!-- エフェクト登録モーダル -->
<div id="effect-modal" class="modal-overlay">
  <div class="modal-content" style="max-width: 600px; background: #131722; color: #fff; padding: 20px; border-radius: 8px; border: 1px solid #2a2f3a;">
    <h3 style="margin-top: 0; border-bottom: 1px solid #2a2f3a; padding-bottom: 8px;">エフェクトマスター登録</h3>

    <!-- 基本情報フォーム -->
    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
      <label style="flex: 1;">シンドローム:
        <select id="eff-syndrome" onchange="updateEffectIdAuto()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:4px; border-radius:4px;">
          <option value="エンジェルハィロゥ">エンジェルハィロゥ (ang)</option>
          <option value="バロル">バロル (bal)</option>
          <option value="ブラックドッグ">ブラックドッグ (bdg)</option>
          <option value="ブラム＝ストーカー">ブラム＝ストーカー (bst)</option>
          <option value="キュマイラ">キュマイラ (qym)</option>
          <option value="エグザイル">エグザイル (exl)</option>
          <option value="ハノマウイ">ハノマウイ (hnm)</option>
          <option value="オルクス">オルクス (orc)</option>
          <option value="サラマンダー">サラマンダー (slm)</option>
          <option value="ソラリス">ソラリス (sol)</option>
          <option value="トライセロトプス">トライセロトプス (tri)</option>
          <option value="ウロボロス">ウロボロス (uro)</option>
          <option value="一般">一般 (gen)</option>
        </select>
      </label>
      <label style="flex: 1;">ID:
        <input type="text" id="eff-id" readonly style="width:100%; background:#1a1d24; color:#a0aec0; border:1px solid #2a2f3a; padding:4px; border-radius:4px;">
      </label>
    </div>

    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
      <label style="flex: 2;">エフェクト名:
        <input type="text" id="eff-name" placeholder="例: 見えざる死神" oninput="generateEffectJson()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:4px; border-radius:4px;">
      </label>
      <label style="flex: 1;">最大Lv:
        <input type="number" id="eff-max-level" value="1" min="1" oninput="generateEffectJson()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:4px; border-radius:4px;">
      </label>
    </div>

    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
      <label style="flex: 1;">タイミング:
        <select id="eff-timing" onchange="generateEffectJson()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:4px; border-radius:4px;">
          <option value="メジャーアクション">メジャーアクション</option>
          <option value="マイナーアクション">マイナーアクション</option>
          <option value="セットアップ">セットアップ</option>
          <option value="イニシアチブ">イニシアチブ</option>
          <option value="オートアクション">オートアクション</option>
          <option value="クリンナップ">クリンナップ</option>
          <option value="常時">常時</option>
        </select>
      </label>
      <label style="flex: 1;">技能:
        <input type="text" id="eff-skill" value="<RC>" oninput="generateEffectJson()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:4px; border-radius:4px;">
      </label>
    </div>

    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
      <label style="flex: 1;">難易度:
        <input type="text" id="eff-difficulty" value="自動成功" oninput="generateEffectJson()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:4px; border-radius:4px;">
      </label>
      <label style="flex: 1;">対象:
        <select id="eff-target-type-sel" onchange="generateEffectJson()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:4px; border-radius:4px;">
          <option value="-">- (組み合わせ依存)</option>
          <option value="自身">自身</option>
          <option value="単体">単体</option>
          <option value="範囲">範囲</option>
          <option value="範囲(選択)">範囲(選択)</option>
          <option value="シーン">シーン</option>
          <option value="シーン(選択)">シーン(選択)</option>
        </select>
      </label>
      <label style="flex: 1;">射程:
        <input type="text" id="eff-range" value="視界" oninput="generateEffectJson()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:4px; border-radius:4px;">
      </label>
    </div>

    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
      <label style="flex: 1;">侵蝕値:
        <input type="text" id="eff-encroach" value="2" oninput="generateEffectJson()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:4px; border-radius:4px;">
      </label>
      <label style="flex: 1;">制限:
        <input type="text" id="eff-limit" value="-" oninput="generateEffectJson()" style="width:100%; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:4px; border-radius:4px;">
      </label>
    </div>

    <!-- 複数効果追加（モジュール）エリア -->
    <div style="border: 1px dashed #3a4253; padding: 10px; border-radius: 6px; margin-top: 10px; background: #0f1218;">
      <div style="font-weight: bold; font-size: 0.85em; color: #8a99ad; margin-bottom: 6px;">■ 効果モジュール追加（複数登録可能）</div>
      
      <div style="display: flex; gap: 6px; align-items: center; margin-bottom: 6px;">
        <select id="eff-stat" style="flex: 1.2; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:4px; border-radius:4px;">
          <optgroup label="ステータス補正">
            <option value="dice">ダイス (dice)</option>
            <option value="crit">C値 (crit)</option>
            <option value="atk">攻撃力 (atk)</option>
            <option value="hp">HP変動 (hp)</option>
            <option value="encroach">追加侵蝕率 (encroach)</option>
            <option value="guard">ガード値 (guard)</option>
            <option value="armor">装甲値 (armor)</option>
          </optgroup>
          <optgroup label="判定能力値・技能変更">
            <option value="change_attr_body">判定能力値: 肉体</option>
            <option value="change_attr_sense">判定能力値: 感覚</option>
            <option value="change_attr_mind">判定能力値: 精神</option>
            <option value="change_attr_social">判定能力値: 社会</option>
            <option value="change_skill">技能変更 (change_skill)</option>
          </optgroup>
          <optgroup label="対象・射程変更/制限">
            <option value="range_override">射程変更 (range_override)</option>
            <option value="target_override">対象変更 (target_override)</option>
            <option value="range_lock">射程変更不可 (range_lock)</option>
            <option value="target_lock">対象変更不可 (target_lock)</option>
          </optgroup>
          <optgroup label="判定・バトル特殊効果">
            <option value="ignore_armor">装甲無視 (ignore_armor)</option>
            <option value="disable_reaction">リアクション不可 (disable_reaction)</option>
            <option value="force_crit">強制クリティカル (force_crit)</option>
            <option value="wipe_troop">トループ一掃 (wipe_troop)</option>
            <option value="apply_debuff">デバフ付与 (apply_debuff)</option>
            <option value="cure_debuff">デバフ解除 (cure_debuff)</option>
          </optgroup>
          <optgroup label="特殊・ギミック（個別処理）">
            <option value="fusion">融合 (fusion)</option>
            <option value="summon_servant">赤色の従者/召喚 (summon_servant)</option>
            <option value="copy_effect">コピー/ウロボロス (copy_effect)</option>
          </optgroup>
        </select>

        <input type="text" id="eff-calc" placeholder="例: level * 3 や true" value="level * 3" style="flex: 1; background:#0b0d12; color:#fff; border:1px solid #2a2f3a; padding:4px; border-radius:4px;">

        <button type="button" onclick="addModificationItem()" style="background: #2b5278; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; white-space: nowrap;">＋効果追加</button>
      </div>

      <!-- 追加済み効果のリスト表示場所 -->
      <ul id="eff-mod-list" style="margin: 6px 0 0 0; padding-left: 18px; color: #cbd5e0; font-size: 0.85em;">
        <!-- JavaScriptから動的に <li> が入ります -->
      </ul>
    </div>

    <!-- JSONプレビューエリア -->
    <div style="margin-top: 12px;">
      <label style="font-size: 0.85em; color: #8a99ad;">JSONプレビュー:</label>
      <textarea id="eff-json-output" readonly style="width: 100%; height: 110px; background: #0b0d12; color: #48bb78; border: 1px solid #2a2f3a; border-radius: 4px; font-family: monospace; font-size: 0.8em; margin-top: 4px;"></textarea>
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px;">
      <button type="button" onclick="downloadEffectsJson()" style="background: #38a169; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">JSONダウンロード</button>
      <button type="button" onclick="closeEffectModal()" style="background: #4a5568; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">閉じる</button>
    </div>
  </div>
</div>
  <!-- スクリプトの分割読み込み（依存関係の順） -->
  <script src="main.js"></script>     <!-- 共通変数、キャラクター管理、初期化など -->
  <script src="effects.js"></script>  <!-- エフェクト関連、逆引き辞書、登録モーダルなど -->
  <script src="battle.js"></script>   <!-- フェーズ・戦闘プロセス管理など -->
  <script src="board.js"></script>    <!-- トークン移動、マップのズーム・パンなど -->
  <script src="chat.js"></script>     <!-- チャット、タブ切替、ダイスロールなど -->
</body>
</html>

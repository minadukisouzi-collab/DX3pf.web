<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DX3rd Online Session Platform</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app-container">
  <header>
    <div class="title-logo">DX3rd VTT</div>
    <div class="timeline-bar">
      <div class="timeline-item">
        <span>Phase:</span>
        <select id="phase-select" style="background:transparent; color:#fff; border:none;">
          <option>オープニング</option>
          <option>ミドル</option>
          <option>クライマックス</option>
        </select>
      </div>
      <div class="timeline-item"><span>Sc:</span> <input type="number" id="scene-num" value="1" style="width:25px; background:transparent; color:#fff; border:none;"></div>
      <div class="timeline-item"><span>Rd:</span> <input type="number" id="round-num" value="1" style="width:25px; background:transparent; color:#fff; border:none;"></div>
      <div class="timeline-item">
        <span style="color:var(--accent-gold); font-weight:bold;">Proc:</span>
        <span id="current-process-text" style="color:#fff;">セットアップ</span>
      </div>
      <div id="process-control-buttons" style="display:flex; gap:3px;"></div>
    </div>
  </header>

  <div id="main-content">
    <div id="char-sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">
          <span>キャラクター一覧</span>
          <button class="btn" onclick="addCharacter()">+ 追加</button>
        </div>
        <div id="character-list"></div>
      </div>
    </div>

    <div id="center-right-area">
      <div id="board-wrapper">
        <div class="board-controls">
          <button class="btn" onclick="zoomBoard(0.1)">＋</button>
          <button class="btn" onclick="zoomBoard(-0.1)">－</button>
          <button class="btn" onclick="resetBoardView()">リセット</button>
        </div>
        <div id="board-viewport"></div>
      </div>

      <div id="chat-wrapper">
        <div class="chat-tabs-bar">
          <div class="chat-tabs" id="chat-tabs-list">
            <div class="chat-tab active" onclick="switchChatTab('main')">メイン</div>
            <div class="chat-tab" onclick="switchChatTab('sub')">雑談</div>
            <div class="chat-tab" onclick="switchChatTab('info')">情報</div>
          </div>
          <button class="chat-toggle-btn" id="chat-toggle-btn" onclick="toggleChatPanel()">▼ 畳む</button>
        </div>
        
        <div id="chat-logs"></div>

        <div class="chat-input-area">
          <select id="chat-speaker-select" style="background:#0b0d12; color:#fff; border:1px solid #2a2f3a; border-radius:4px; max-width:80px;">
            <option value="GM">GM</option>
          </select>
          <input type="text" id="chat-input" placeholder="ダイス例: 7dx+3@8 または メッセージ" onkeydown="if(event.key==='Enter') sendMessage()">
          <button class="btn btn-red" onclick="sendMessage()">送信</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="gm-modal">
  <div class="modal-card">
    <div style="font-weight:bold; margin-bottom:6px; display:flex; justify-content:space-between; font-size:0.85rem;">
      <span id="modal-char-name">BS編集</span>
      <button class="btn" onclick="closeModal()">✕</button>
    </div>
    <div class="bs-toggle-grid" id="modal-bs-grid"></div>
    <div style="margin-top:10px; text-align:right;">
      <button class="btn btn-red" onclick="closeModal()">閉じる</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>

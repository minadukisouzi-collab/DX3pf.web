<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>DX3rd VTT - ログイン</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <span class="title-logo" style="font-size: 1.2rem;">DX3rd VTT</span>
        <button class="theme-toggle" id="toggle-theme">ライトモード</button>
      </div>
      
      <div class="auth-body">
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px;">プレイヤー認証 / ログイン</p>
        
        <label style="font-size: 0.8rem;">プレイヤー名</label>
        <input type="text" id="username" class="auth-input" placeholder="名前を入力">
        
        <label style="font-size: 0.8rem;">パスコード</label>
        <input type="password" id="passcode" class="auth-input" placeholder="パスコードを入力">
        
        <button id="login-btn" class="btn btn-red" style="width: 100%; padding: 10px; font-weight: bold; margin-top: 5px;">ログイン</button>
        <button id="register-btn" class="btn" style="width: 100%; padding: 10px; font-weight: bold; margin-top: 8px; background: transparent; border: 1px solid var(--accent-red); color: var(--accent-red);">新規アカウント登録</button>
        
        <div id="message" style="color: var(--accent-red); margin-top: 12px; font-size: 0.85rem; text-align: center;"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './config.js';

    const htmlTag = document.documentElement;
    const toggleBtn = document.getElementById('toggle-theme');
    
    function setTheme(theme) {
      htmlTag.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      toggleBtn.textContent = theme === 'dark' ? 'ライトモード' : 'ダークモード';
    }

    setTheme(localStorage.getItem('theme') || 'dark');
    toggleBtn.addEventListener('click', () => {
      setTheme(htmlTag.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    const nameInput = document.getElementById('username');
    const passInput = document.getElementById('passcode');
    const msgDiv = document.getElementById('message');

    const lastUsername = localStorage.getItem('last_username');
    if (lastUsername) nameInput.value = lastUsername;

    // ログイン処理（ログイン成功時にオンライン状態を有効化し、現在地をロビー null にセット）
    document.getElementById('login-btn').addEventListener('click', async () => {
      const name = nameInput.value.trim();
      const passcode = passInput.value.trim();
      if (!name || !passcode) {
        msgDiv.textContent = '名前とパスコードを入力してください。';
        return;
      }

      const { data, error } = await supabase
        .from('players')
        .select('*')
        .eq('name', name)
        .eq('passcode', passcode)
        .maybeSingle();

      if (error || !data) {
        msgDiv.textContent = 'ユーザーが見つからないか、パスコードが違います。';
        return;
      }

      // ログイン成功時にオンラインステータスを更新
      await supabase
        .from('players')
        .update({
          is_online: true,
          current_room_id: null,
          last_seen_at: new Date().toISOString()
        })
        .eq('id', data.id);

      localStorage.setItem('player_id', data.id);
      localStorage.setItem('player_name', data.name);
      localStorage.setItem('last_username', data.name);

      window.location.href = 'rooms.html';
    });

    // 新規登録処理（登録と同時にオンライン状態＆ロビー滞在としてデータをINSERT）
    document.getElementById('register-btn').addEventListener('click', async () => {
      const name = nameInput.value.trim();
      const passcode = passInput.value.trim();
      if (!name || !passcode) {
        msgDiv.textContent = '登録する名前とパスコードを入力してください。';
        return;
      }

      const { data: existing } = await supabase
        .from('players')
        .select('id')
        .eq('name', name)
        .maybeSingle();

      if (existing) {
        msgDiv.textContent = 'その名前はすでに使われています。';
        return;
      }

      const { data, error } = await supabase
        .from('players')
        .insert([{ 
          name: name, 
          passcode: passcode,
          is_online: true,
          current_room_id: null,
          last_seen_at: new Date().toISOString()
        }])
        .select()
        .single();

      if (error) {
        msgDiv.textContent = '登録エラー: ' + error.message;
        return;
      }

      localStorage.setItem('player_id', data.id);
      localStorage.setItem('player_name', data.name);
      localStorage.setItem('last_username', data.name);

      window.location.href = 'rooms.html';
    });
  </script>
</body>
</html>

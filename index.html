<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DX3rd Online Session Platform</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app-container">
  <header>
    <div class="title-logo">DX3rd VTT</div>
    <div class="timeline-bar">
      <div class="timeline-item">
        <span style="color:var(--accent-gold); font-weight:bold;">Phase:</span>
        <span id="current-phase-text" style="color:#fff;">オープニングフェイズ</span>
      </div>
      <div class="timeline-item"><span>Sc:</span> <input type="number" id="scene-num" value="1" style="width:25px; background:transparent; color:#fff; border:none;" readonly></div>
      <div class="timeline-item"><span>Rd:</span> <input type="number" id="round-num" value="1" style="width:25px; background:transparent; color:#fff; border:none;" readonly></div>
      
      <!-- 通常モード / 戦闘モードの切り替えエリア -->
      <div id="mode-controls" style="display:flex; gap:4px; align-items:center;"></div>
    </div>
  </header>

  <div id="main-content">
    <div id="char-sidebar">
      <div class="sidebar-section">
        <!-- キャラクター一覧タイトルの部分 -->
          <div class="sidebar-title">
             <span>キャラクター一覧</span>
               <div style="display:flex; gap:4px;">
                  <button class="btn btn-purple" onclick="openEffectModal()" style="font-size:0.7rem;">+ エフェクト追加</button>
    <button class="btn" onclick="addCharacter()">+ キャラ追加</button>
  </div>
</div>
        <div id="character-list"></div>
      </div>
    </div>

    <div id="center-right-area">
      <div id="board-wrapper">
        <div class="board-controls">
          <button class="btn" onclick="zoomBoard(0.1)">＋</button>
          <button class="btn" onclick="zoomBoard(-0.1)">－</button>
          <button class="btn" onclick="resetBoardView()">リセット</button>
        </div>
        <div id="board-viewport"></div>
      </div>

      <div id="chat-wrapper">
        <div class="chat-tabs-bar">
          <div class="chat-tabs" id="chat-tabs-list">
            <div class="chat-tab active" onclick="switchChatTab('main')">メイン</div>
            <div class="chat-tab" onclick="switchChatTab('sub')">雑談</div>
            <div class="chat-tab" onclick="switchChatTab('info')">情報</div>
          </div>
          <button class="chat-toggle-btn" id="chat-toggle-btn" onclick="toggleChatPanel()">▼ 畳む</button>
        </div>
        
        <div id="chat-logs"></div>

        <div class="chat-input-area">
          <select id="chat-speaker-select" style="background:#0b0d12; color:#fff; border:1px solid #2a2f3a; border-radius:4px; max-width:80px;">
            <option value="GM">GM</option>
          </select>
          <input type="text" id="chat-input" placeholder="ダイス例: 7dx+3@8 または メッセージ" onkeydown="if(event.key==='Enter') sendMessage()">
          <button class="btn btn-red" onclick="sendMessage()">送信</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="gm-modal">
  <div class="modal-card">
    <div style="font-weight:bold; margin-bottom:6px; display:flex; justify-content:space-between; font-size:0.85rem;">
      <span id="modal-char-name">BS編集</span>
      <button class="btn" onclick="closeModal()">✕</button>
    </div>
    <div class="bs-toggle-grid" id="modal-bs-grid"></div>
    <div style="margin-top:10px; text-align:right;">
      <button class="btn btn-red" onclick="closeModal()">閉じる</button>
    </div>
  </div>
</div>
<!-- エフェクト登録モーダル -->
<div class="modal-overlay" id="effect-modal">
  <div class="modal-card" style="width: 480px;">
    <div style="font-weight:bold; margin-bottom:10px; display:flex; justify-content:space-between; font-size:0.9rem;">
      <span>新規エフェクト登録（マスターデータ作成）</span>
      <button class="btn" onclick="closeEffectModal()">✕</button>
    </div>
    
<!-- エフェクト登録モーダル -->
<div class="modal-overlay" id="effect-modal">
  <div class="modal-card" style="width: 520px; max-height: 90vh; overflow-y: auto;">
    <div style="font-weight:bold; margin-bottom:10px; display:flex; justify-content:space-between; font-size:0.9rem;">
      <span>新規エフェクト登録（マスターデータ作成）</span>
      <button class="btn" onclick="closeEffectModal()">✕</button>
    </div>
    
    <div style="display:flex; flex-direction:column; gap:8px; font-size:0.8rem;">
      
      <!-- シンドローム＆自動ID -->
      <div style="display:flex; gap:8px;">
        <div style="flex:1;">
          <span>シンドローム:</span>
          <select id="eff-syndrome" onchange="updateEffectIdAuto()" style="width:100%; background:var(--bg-main); border:1px solid var(--border-color); color:#fff; padding:4px; border-radius:4px; margin-top:2px;">
            <option value="ang">エンジェルハィロゥ (ang)</option>
            <option value="bal">バロール (bal)</option>
            <option value="bld">ブラックドッグ (bld)</option>
            <option value="bsk">ブラム・ストーカー (bsk)</option>
            <option value="cym">キュマイラ (cym)</option>
            <option value="exg">エグザイル (exg)</option>
            <option value="hnm">ハヌマーン (hnm)</option>
            <option value="mol">モルフェウス (mol)</option>
            <option value="num">ノイマン (num)</option>
            <option value="ork">オルクス (ork)</option>
            <option value="slm">サラマンダー (slm)</option>
            <option value="slr">ソラリス (slr)</option>
            <option value="uro">ウロボロス (uro)</option>
            <option value="gen">一般 (gen)</option>
          </select>
        </div>
        <div style="flex:1;">
          <span>エフェクトID (自動):</span>
          <input type="text" id="eff-id" readonly style="width:100%; background:#050608; border:1px solid var(--border-color); color:#a8dadc; padding:4px; border-radius:4px; margin-top:2px;">
        </div>
      </div>

      <!-- 名称 ＆ 最大レベル -->
      <div style="display:flex; gap:8px;">
        <div style="flex:3;">
          <span>エフェクト名:</span>
          <input type="text" id="eff-name" placeholder="例: イルミネイト" style="width:100%; background:var(--bg-main); border:1px solid var(--border-color); color:#fff; padding:4px; border-radius:4px; margin-top:2px;">
        </div>
        <div style="flex:1;">
          <span>最大Lv:</span>
          <input type="number" id="eff-max-level" value="3" min="1" style="width:100%; background:var(--bg-main); border:1px solid var(--border-color); color:#fff; padding:4px; border-radius:4px; margin-top:2px;">
        </div>
      </div>

      <!-- タイミング ＆ 技能 -->
      <div style="display:flex; gap:8px;">
        <div style="flex:1;">
          <span>タイミング:</span>
          <select id="eff-timing" style="width:100%; background:var(--bg-main); border:1px solid var(--border-color); color:#fff; padding:4px; border-radius:4px; margin-top:2px;">
            <option value="セットアッププロセス">セットアッププロセス</option>
            <option value="イニシアチブプロセス">イニシアチブプロセス</option>
            <option value="マイナーアクション">マイナーアクション</option>
            <option value="メジャーアクション" selected>メジャーアクション</option>
            <option value="リアクション">リアクション</option>
            <option value="オートアクション">オートアクション</option>
            <option value="クリンナッププロセス">クリンナッププロセス</option>
          </select>
        </div>
        <div style="flex:1;">
          <span>技能:</span>
          <input type="text" id="eff-skill" placeholder="例: &lt;RC&gt; や 白兵" value="&lt;RC&gt;" style="width:100%; background:var(--bg-main); border:1px solid var(--border-color); color:#fff; padding:4px; border-radius:4px; margin-top:2px;">
        </div>
      </div>

      <!-- 難易度 ＆ 対象 -->
      <div style="display:flex; gap:8px;">
        <div style="flex:1;">
          <span>難易度:</span>
          <select id="eff-difficulty" style="width:100%; background:var(--bg-main); border:1px solid var(--border-color); color:#fff; padding:4px; border-radius:4px; margin-top:2px;">
            <option value="自動成功" selected>自動成功</option>
            <option value="対決">対決</option>
            <option value="その他">その他</option>
          </select>
        </div>
        <div style="flex:1;">
          <span>対象:</span>
          <select id="eff-target-type-sel" style="width:100%; background:var(--bg-main); border:1px solid var(--border-color); color:#fff; padding:4px; border-radius:4px; margin-top:2px;">
            <option value="-" selected>-</option>
            <option value="単体">単体</option>
            <option value="範囲">範囲</option>
            <option value="範囲(選択)">範囲(選択)</option>
            <option value="シーン">シーン</option>
            <option value="シーン(選択)">シーン(選択)</option>
          </select>
        </div>
      </div>

      <!-- 射程 ＆ 侵蝕値 ＆ 制限 -->
      <div style="display:flex; gap:8px;">
        <div style="flex:1;">
          <span>射程:</span>
          <select id="eff-range" style="width:100%; background:var(--bg-main); border:1px solid var(--border-color); color:#fff; padding:4px; border-radius:4px; margin-top:2px;">
            <option value="至近">至近</option>
            <option value="視界" selected>視界</option>
            <option value="m指定">m指定</option>
          </select>
        </div>
        <div style="flex:1;">
          <span>侵蝕値 (コスト):</span>
          <input type="text" id="eff-encroach" value="2" placeholder="例: 2 や 1d10" style="width:100%; background:var(--bg-main); border:1px solid var(--border-color); color:#fff; padding:4px; border-radius:4px; margin-top:2px;">
        </div>
        <div style="flex:1;">
          <span>制限:</span>
          <select id="eff-limit" style="width:100%; background:var(--bg-main); border:1px solid var(--border-color); color:#fff; padding:4px; border-radius:4px; margin-top:2px;">
            <option value="-" selected>-</option>
            <option value="80%">80%</option>
            <option value="100%">100%</option>
            <option value="120%">120%</option>
            <option value="ピュアブリード">ピュアブリード</option>
            <option value="リミット">リミット</option>
            <option value="エネミーエフェクト">エネミーエフェクト</option>
            <option value="Dロイス">Dロイス</option>
            <option value="Eロイス">Eロイス</option>
          </select>
        </div>
      </div>

      <!-- 効果（変動値設定） -->
      <div style="border-top:1px solid var(--border-color); padding-top:6px; margin-top:2px;">
        <span style="font-weight:bold; color:var(--accent-gold);">自動計算用 ステータス変動設定:</span>
        <div style="display:flex; gap:8px; margin-top:4px;">
          <div style="flex:1;">
            <span>対象ステータス:</span>
            <select id="eff-stat" style="width:100%; background:var(--bg-main); border:1px solid var(--border-color); color:#fff; padding:4px; border-radius:4px; margin-top:2px;">
              <option value="dice">ダイス数 (dice)</option>
              <option value="crit">クリティカル値 (crit)</option>
              <option value="atk">攻撃力 (atk)</option>
            </select>
          </div>
          <div style="flex:1;">
            <span>計算式:</span>
            <input type="text" id="eff-calc" value="level * 2" style="width:100%; background:var(--bg-main); border:1px solid var(--border-color); color:#fff; padding:4px; border-radius:4px; margin-top:2px;">
          </div>
        </div>
      </div>

      <div>
        <span>生成された JSON プレビュー:</span>
        <textarea id="eff-json-output" readonly style="width:100%; height:70px; background:#050608; border:1px solid var(--border-color); color:#a8dadc; font-family:monospace; font-size:0.75rem; padding:4px; border-radius:4px; margin-top:2px;"></textarea>
      </div>
    </div>

    <div style="margin-top:10px; display:flex; justify-content:space-between; align-items:center;">
      <button class="btn" onclick="generateEffectJson()">JSONプレビュー更新</button>
      <div style="display:flex; gap:4px;">
        <button class="btn btn-gold" onclick="downloadEffectsJson()">JSONダウンロード</button>
        <button class="btn btn-red" onclick="closeEffectModal()">閉じる</button>
      </div>
    </div>
  </div>
</div>
  <!-- スクリプトの分割読み込み（依存関係の順） -->
  <script src="main.js"></script>     <!-- 共通変数、キャラクター管理、初期化など -->
  <script src="effects.js"></script>  <!-- エフェクト関連、逆引き辞書、登録モーダルなど -->
  <script src="battle.js"></script>   <!-- フェーズ・戦闘プロセス管理など -->
  <script src="board.js"></script>    <!-- トークン移動、マップのズーム・パンなど -->
  <script src="chat.js"></script>     <!-- チャット、タブ切替、ダイスロールなど -->
</body>
</html>

</body>
</html>

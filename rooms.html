<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>DX3rd VTT - ルーム選択</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ルーム選択画面専用の微調整（スクロールが必要になったときの対策） */
    .auth-card {
      width: 100%;
      max-width: 520px; /* ルーム一覧が見やすいように少しだけ広めに */
      max-height: 85dvh;
      display: flex;
      flex-direction: column;
    }
    .auth-body {
      overflow-y: auto; /* ルームが増えてもカード内でスクロールできるように */
    }
    .room-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .room-item {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      padding: 12px 15px;
      margin-bottom: 10px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .user-info {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <!-- ログイン画面と共通のコンテナで完全に中央配置に固定 -->
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <span class="title-logo" style="font-size: 1.2rem;">DX3rd VTT - ルーム選択</span>
        <button class="theme-toggle" id="toggle-theme">ライトモード</button>
      </div>
      
      <div class="auth-body">
        <div class="user-info">
          <span id="welcome-msg">ログイン中ユーザー: 読み込み中...</span>
          <button class="btn" id="logout-btn" style="width: auto; padding: 4px 8px; font-size: 0.75rem; background: transparent; border: 1px solid var(--accent-red); color: var(--accent-red);">ログアウト</button>
        </div>

        <hr style="border: none; border-top: 1px solid var(--border-color); margin: 15px 0;">

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
          <h3 style="margin: 0; font-size: 1.05rem; color: var(--text-main);">参加可能なルーム一覧</h3>
          <button id="create-room-btn" class="btn btn-red" style="width: auto; padding: 8px 14px;">＋ 新規ルーム作成</button>
        </div>

        <ul class="room-list" id="room-list">
          <li style="text-align: center; padding: 20px; color: var(--text-muted);">ルームを読み込み中...</li>
        </ul>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './config.js';

    // 1. ログイン認証チェック
    const playerId = localStorage.getItem('player_id');
    const playerName = localStorage.getItem('player_name');
    
    if (!playerId) {
      alert('ログインしてください。');
      window.location.href = 'index.html'; // ログイン画面（index.html）へ
    } else {
      document.getElementById('welcome-msg').textContent = `プレイヤー: ${playerName} さん`;
    }

    // 2. テーマ切替
    const htmlTag = document.documentElement;
    const toggleBtn = document.getElementById('toggle-theme');
    
    function setTheme(theme) {
      htmlTag.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
      toggleBtn.textContent = theme === 'dark' ? 'ライトモード' : 'ダークモード';
    }

    setTheme(localStorage.getItem('theme') || 'dark');
    toggleBtn.addEventListener('click', () => {
      const newTheme = htmlTag.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      setTheme(newTheme);
    });

    // 3. ログアウト処理（確実におうち＝index.htmlへ戻す）
    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('player_id');
      localStorage.removeItem('player_name');
      window.location.href = 'index.html';
    });

    // 4. タイムアウト付きルーム一覧の取得と表示
    async function fetchRooms() {
      const roomListUl = document.getElementById('room-list');
      const timeoutPromise = new Promise((_, reject) => 
        setTimeout(() => reject(new Error('タイムアウト')), 5000)
      );

      try {
        const fetchPromise = supabase
          .from('rooms')
          .select('*')
          .order('created_at', { ascending: false });

        const { data: rooms, error } = await Promise.race([fetchPromise, timeoutPromise]);

        if (error) throw error;

        if (!rooms || rooms.length === 0) {
          roomListUl.innerHTML = `
            <li style="text-align: center; padding: 20px; color: var(--text-muted); font-size: 0.85rem;">
              参加可能なルームがありません。<br>上の「新規ルーム作成」からセッション部屋を作成してください。
            </li>`;
          return;
        }

        roomListUl.innerHTML = '';
        rooms.forEach(room => {
          const li = document.createElement('li');
          li.className = 'room-item';
          li.innerHTML = `
            <div>
              <strong style="color: var(--text-main);">${room.name || '無題のルーム'}</strong>
              <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">ID: ${room.id}</div>
            </div>
            <button class="btn btn-blue" onclick="window.location.href='vtt.html?room=${room.id}'">入室する</button>
          `;
          roomListUl.appendChild(li);
        });

      } catch (err) {
        console.error(err);
        roomListUl.innerHTML = `
          <li style="text-align: center; padding: 20px; color: var(--text-muted); font-size: 0.85rem;">
            参加可能なルームがありません。<br>上のボタンから新しいルームを作成してください。
          </li>`;
      }
    }

    // 5. 新規ルーム作成処理
    document.getElementById('create-room-btn').addEventListener('click', async () => {
      const roomName = prompt('作成するルーム名を入力してください:', `${playerName}のセッション`);
      if (!roomName) return;

      const { data, error } = await supabase
        .from('rooms')
        .insert([{ name: roomName, host_id: playerId }])
        .select()
        .single();

      if (error) {
        alert('ルームの作成に失敗しました: ' + error.message);
        return;
      }

      window.location.href = `vtt.html?room=${data.id}`;
    });

    fetchRooms();
  </script>
</body>
</html>
